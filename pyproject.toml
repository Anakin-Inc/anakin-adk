[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anakin-adk"
version = "0.2.0"
description = "Google ADK tools for Anakin: web scraping, search, research, Wire actions, monitoring and AI visibility"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Anakin", email = "hello@anakin.io" }]
keywords = ["google-adk", "adk", "anakin", "web-scraping", "search", "ai-agent", "wire", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-adk>=1.16",
    "anakin-sdk>=0.2.0,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Anakin-Inc/anakin-adk"
Documentation = "https://anakin.io/docs"
Repository = "https://github.com/Anakin-Inc/anakin-adk"
Issues = "https://github.com/Anakin-Inc/anakin-adk/issues"

[tool.hatch.build.targets.sdist]
exclude = [".env", "tests/e2e_test.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
asyncio_mode = "auto"
